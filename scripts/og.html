<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "YekanX"; src: url("../assets/fonts/iranyekanx-fanum-vf.woff2") format("woff2"); font-weight: 100 1000; }
  @font-face { font-family: "YekanX Latin"; src: url("../assets/fonts/iranyekanx-latin-vf.woff2") format("woff2"); font-weight: 100 1000; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #F4F1EC; color: #0B0A0C; font-family: "YekanX", sans-serif; font-variation-settings: "dots" 4;
         display: grid; grid-template-columns: 1fr 470px; align-items: center; padding: 0 68px 0 52px; gap: 36px; }
  .copy { text-align: right; }
  .kicker { display: inline-flex; align-items: center; gap: 12px; height: 48px; padding: 0 22px; border-radius: 999px;
            background: rgba(255,255,255,.8); box-shadow: 0 0 0 1px rgba(11,10,12,.07), 0 10px 24px -12px rgba(11,10,12,.25);
            font-size: 21px; font-weight: 700; }
  .kicker i { width: 11px; height: 11px; border-radius: 50%; background: #FE4222; }
  h1 { margin-top: 24px; font-size: 53px; line-height: 1.34; font-weight: 850; white-space: nowrap; }
  h1 .brand { font-family: "YekanX Latin"; font-weight: 800; letter-spacing: -.025em; white-space: nowrap; }
  p { margin-top: 18px; font-size: 25px; line-height: 1.7; color: rgba(11,10,12,.72); }
  img { width: 470px; height: auto; display: block; }
</style>
</head>
<body>
  <div class="copy">
    <span class="kicker"><i></i>ثبت‌نام کسب‌وکارها</span>
    <h1>کسب‌وکارتان را به<br><span class="brand" dir="ltr">Went To Event</span> بیاورید</h1>
    <p>فرم کوتاه را پر کنید؛ با شما تماس می‌گیریم.</p>
  </div>
  <img src="../assets/brand/logo-1117.webp" alt="">
</body>
</html>
